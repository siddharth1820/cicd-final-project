
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        pip install --no-cache-dir nose
        if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi
        nosetests

